# Included in every location: nginx does not inherit add_header into a
# location that sets its own headers.
# The UI only loads its own bundled scripts and calls its own origin;
# captured responses are rendered as text, never as markup.
# style-src allows 'unsafe-inline' because Radix dialogs inject a <style>
# element with runtime-computed scrollbar compensation (react-remove-scroll),
# which neither a hash nor a static nonce can cover. Scripts stay 'self' only.
# No Cross-Origin-Opener-Policy: browsers ignore it on non-HTTPS origins and
# log a console error on every page load; the app opens no cross-origin
# windows, and framing is already denied by frame-ancestors/X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
